name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de sistema (WeasyPrint/Pango)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0

      - name: Instalar proyecto y herramientas de desarrollo
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src app.py main.py tests

      - name: Tests (pytest, offline/mocked, sin red)
        run: pytest
