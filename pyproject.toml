[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cotizador-emerson"
version = "1.0.0"
description = "Sistema de cotización de componentes electrónicos (Guatemala): metabuscador de 3 tiendas, BOM paralela, PDF/HTML/CSV."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "rich>=13.7.0",
    "jinja2>=3.1.0",
    "weasyprint>=60.0",
    "streamlit>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

# Ruff: reglas pragmáticas (errores reales de pyflakes + bugs de estilo comunes),
# sin forzar estilo cosmético (longitud de línea, formato) sobre el código existente.
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
